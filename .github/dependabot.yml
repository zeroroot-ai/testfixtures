version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
      actions-deps:
        patterns:
          - '*'
        exclude-patterns:
          - github/codeql-action*
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      include: scope
