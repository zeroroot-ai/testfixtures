name: test
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod && (test ! -f go.sum || git diff --exit-code go.sum)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

      # #10: the standing tracker for declarations nothing reads. The baseline
      # only shrinks, so adding one fails here. The self-test proves the step
      # can fail and names the planted declaration.
      - name: lint-unwired
        run: make lint-unwired
      - name: lint-unwired-selftest
        run: make lint-unwired-selftest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
